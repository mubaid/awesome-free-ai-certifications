name: Catalog
# Assumes this folder is published as the repo root.
on:
  push:
    branches: [main]
    paths:
      - "data/course_catalog.csv"
      - "scripts/build_readme.py"
  pull_request:
    paths:
      - "data/course_catalog.csv"
      - "scripts/build_readme.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Fail if README was not regenerated
        run: python3 scripts/build_readme.py --check

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Regenerate README from catalog
        run: python3 scripts/build_readme.py
      - name: Commit refreshed README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README already in sync."
            exit 0
          fi
          git commit -m "docs: refresh README from catalog"
          git push origin HEAD:main
